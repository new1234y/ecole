<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire ENT — Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0f14;
      --surface: #151921;
      --surface2: #1c2230;
      --border: rgba(255,255,255,.08);
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #5b8def;
      --accent-hover: #4a7bd4;
      --student: #3ecf8e;
      --teacher: #f5a623;
      --personnel: #64b5f6;
      --relative: #e879a9;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(91,141,239,.18), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; padding: 24px; }

    /* Header & Actions */
    header {
      display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
      gap: 20px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
    }
    .brand h1 { font-family: 'Instrument Serif', serif; font-size: 2.6rem; font-weight: 400; }
    .brand p { color: var(--muted); font-size: .95rem; margin-top: 4px; }
    
    .admin-actions { display: flex; gap: 12px; }
    .btn-primary, .btn-secondary {
      padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: .9rem;
      cursor: pointer; transition: all .2s; border: none; font-family: inherit;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { border-color: var(--accent); }

    /* Layout & Sidebar */
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }

    aside { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; position: sticky; top: 24px; }
    .filter-section { margin-bottom: 20px; }
    .filter-label { font-size: .72rem; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
    
    .search-box, .filter-select, .form-control {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; color: var(--text); font: inherit; font-size: .9rem; outline: none;
    }
    .search-box:focus, .form-control:focus { border-color: var(--accent); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--border); background: var(--surface2); color: var(--muted);
      border-radius: 999px; padding: 5px 12px; font-size: .78rem; cursor: pointer; user-select: none;
    }
    .chip.active { color: #fff; border-color: transparent; }
    .chip[data-type="Student"].active { background: var(--student); }
    .chip[data-type="Teacher"].active { background: var(--teacher); color: #1a1200; }
    
    .btn-reset { width: 100%; margin-top: 8px; padding: 10px; background: transparent; border: 1px dashed var(--border); border-radius: 10px; color: var(--muted); cursor: pointer; }
    .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

    /* Toolbar & Views */
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .result-count { font-size: .9rem; color: var(--muted); }
    .view-tabs { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .view-tab { padding: 7px 14px; border: none; background: transparent; color: var(--muted); border-radius: 8px; cursor: pointer; font-size: .82rem; }
    .view-tab.active { background: var(--surface2); color: var(--text); }

    /* Cards Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: transform .15s, border-color .15s; }
    .card:hover { transform: translateY(-2px); border-color: rgba(91,141,239,.35); box-shadow: var(--shadow); }
    
    .card-top { display: flex; gap: 12px; margin-bottom: 12px; }
    .avatar { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; color: #fff; }
    .avatar.Student { background: linear-gradient(135deg, #2da86a, var(--student)); }
    .avatar.Teacher { background: linear-gradient(135deg, #d4890f, var(--teacher)); color: #1a1200; }
    .avatar.Personnel { background: linear-gradient(135deg, #3d8fd4, var(--personnel)); }
    .avatar.Relative { background: linear-gradient(135deg, #c44d7a, var(--relative)); }

    .card-name { font-weight: 600; font-size: .95rem; }
    .badge { font-size: .68rem; font-weight: 600; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; margin-top: 4px; display: inline-block;}
    .badge.Student { background: rgba(62,207,142,.15); color: var(--student); }
    .badge.Teacher { background: rgba(245,166,35,.15); color: var(--teacher); }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag { font-size: .7rem; padding: 3px 8px; border-radius: 6px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
    .tag.old-class { border-color: rgba(232,121,169,.3); color: #e879a9; text-decoration: line-through; }
    .tag.new-class { border-color: rgba(62,207,142,.3); color: #3ecf8e; font-weight: 600; }

    /* Modals */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-family: 'Instrument Serif', serif; font-size: 1.8rem; font-weight: 400; }
    .modal-close { background: var(--surface2); border: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
    
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: .8rem; margin-bottom: 6px; color: var(--muted); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1 id="schoolTitle">Annuaire ENT — Mode Admin</h1>
        <p>Gestion des profils et transitions de classes</p>
      </div>
      <div class="admin-actions">
        <!-- Input caché pour charger la DB -->
        <input type="file" id="importDbInput" accept=".json" style="display: none;">
        <button class="btn-secondary" onclick="document.getElementById('importDbInput').click()">📁 Nouvelle BD</button>
        <button class="btn-primary" onclick="openAddModal()">+ Ajouter Personne</button>
      </div>
    </header>

    <div class="layout">
      <aside>
        <div class="filter-section">
          <div class="filter-label">Recherche</div>
          <input type="search" class="search-box" id="searchInput" placeholder="Nom, login...">
        </div>
        <div class="filter-section">
          <div class="filter-label">Profil</div>
          <div class="chips" id="typeChips">
            <button class="chip" data-type="Student">Élève</button>
            <button class="chip" data-type="Teacher">Enseignant</button>
            <button class="chip" data-type="Personnel">Personnel</button>
          </div>
        </div>
        <div class="filter-section">
          <div class="filter-label">Filtre Classe</div>
          <select class="filter-select" id="classFilter">
            <option value="">Toutes les classes</option>
            <!-- Rempli en JS -->
          </select>
        </div>
        <button class="btn-reset" id="resetBtn">Réinitialiser les filtres</button>
      </aside>

      <main>
        <div class="toolbar">
          <div class="result-count"><span id="resultCount">0</span> personne(s) trouvée(s)</div>
          <div class="view-tabs">
            <button class="view-tab active" data-view="grid">Grille</button>
            <button class="view-tab" data-view="class">Par classe</button>
          </div>
        </div>
        <div id="content"></div>
      </main>
    </div>
  </div>

  <!-- Modal Ajout Personne -->
  <div class="overlay" id="addModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Nouvelle Personne</h2>
        <button class="modal-close" onclick="closeAddModal()">×</button>
      </div>
      <form id="addPersonForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control" id="f_prenom" required>
          </div>
          <div class="form-group">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" id="f_nom" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Type de profil</label>
          <select class="form-control" id="f_type">
            <option value="Student">Élève</option>
            <option value="Teacher">Enseignant</option>
            <option value="Personnel">Personnel</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Ancienne Classe</label>
            <input type="text" class="form-control" id="f_oldclass" placeholder="Ex: 2GT6">
          </div>
          <div class="form-group">
            <label class="form-label">Nouvelle Classe</label>
            <input type="text" class="form-control" id="f_newclass" placeholder="Ex: 1G2">
          </div>
        </div>
        <button type="submit" class="btn-primary" style="width:100%; margin-top: 10px;">Enregistrer la personne</button>
      </form>
    </div>
  </div>

  <script>
    // --- DONNÉES INITIALES (Simulation) ---
    let USERS = [
      { id: "1", displayName: "BUGRA Matheo", type: "Student", oldClass: "2GT6", newClass: "1G2" },
      { id: "2", displayName: "UCAN Fatma Ela", type: "Student", oldClass: "2GT1", newClass: "1G1" },
      { id: "3", displayName: "DRELA Aubane", type: "Student", oldClass: "1G2", newClass: "TG2" },
      { id: "4", displayName: "MARTIN Professeur", type: "Teacher", oldClass: "", newClass: "SVT" }
    ];

    let state = { search: '', types: new Set(), className: '', view: 'grid' };
    const TYPE_LABELS = { Student: 'Élève', Teacher: 'Enseignant', Personnel: 'Personnel' };

    function initials(name) {
      if (!name) return '?';
      const p = name.trim().split(/\s+/);
      return p.length >= 2 ? (p[0][0] + p[p.length - 1][0]).toUpperCase() : name.slice(0, 2).toUpperCase();
    }

    // --- RENDU & FILTRES ---
    function renderClassOptions() {
      const classes = new Set();
      USERS.forEach(u => {
        if(u.oldClass) classes.add(u.oldClass);
        if(u.newClass) classes.add(u.newClass);
      });
      const sel = document.getElementById('classFilter');
      sel.innerHTML = '<option value="">Toutes les classes</option>';
      Array.from(classes).sort().forEach(c => {
        sel.innerHTML += `<option value="${c}">${c}</option>`;
      });
    }

    function applyFilters() {
      const q = state.search.toLowerCase();
      const filtered = USERS.filter(u => {
        if (state.types.size && !state.types.has(u.type)) return false;
        if (state.className && u.oldClass !== state.className && u.newClass !== state.className) return false;
        if (q && !u.displayName.toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById('resultCount').textContent = filtered.length;
      const content = document.getElementById('content');

      if (!filtered.length) {
        content.innerHTML = `<div style="text-align:center; padding: 40px; color:var(--muted);">Aucun résultat</div>`;
        return;
      }

      if (state.view === 'grid') {
        content.innerHTML = `<div class="grid">${filtered.map(renderCard).join('')}</div>`;
      } else {
        // Vue par classe (Groupé par Nouvelle Classe)
        const byClass = {};
        filtered.forEach(u => {
          const c = u.newClass || 'Sans affectation';
          if (!byClass[c]) byClass[c] = [];
          byClass[c].push(u);
        });
        content.innerHTML = Object.keys(byClass).sort().map(c => `
          <div style="margin-bottom:24px;">
            <h3 style="font-family:'Instrument Serif'; font-size:1.5rem; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px;">${c} (${byClass[c].length})</h3>
            <div class="grid">${byClass[c].map(renderCard).join('')}</div>
          </div>
        `).join('');
      }
    }

    function renderCard(u) {
      return `
        <article class="card">
          <div class="card-top">
            <div class="avatar ${u.type}">${initials(u.displayName)}</div>
            <div>
              <div class="card-name">${u.displayName}</div>
              <span class="badge ${u.type}">${TYPE_LABELS[u.type] || u.type}</span>
            </div>
          </div>
          <div class="tag-row">
            ${u.oldClass ? `<span class="tag old-class">Ancienne: ${u.oldClass}</span>` : ''}
            ${u.newClass ? `<span class="tag new-class">Nouvelle: ${u.newClass}</span>` : ''}
          </div>
        </article>
      `;
    }

    // --- EVENT LISTENERS UI ---
    document.getElementById('searchInput').addEventListener('input', e => { state.search = e.target.value; applyFilters(); });
    document.getElementById('classFilter').addEventListener('change', e => { state.className = e.target.value; applyFilters(); });
    
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const t = chip.dataset.type;
        if (state.types.has(t)) { state.types.delete(t); chip.classList.remove('active'); }
        else { state.types.add(t); chip.classList.add('active'); }
        applyFilters();
      });
    });

    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        state.view = tab.dataset.view;
        applyFilters();
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state = { search: '', types: new Set(), className: '', view: state.view };
      document.getElementById('searchInput').value = '';
      document.getElementById('classFilter').value = '';
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      applyFilters();
    });

    // --- FONCTIONNALITÉS D'ADMINISTRATION ---

    // 1. Ajout de nouvelle personne
    function openAddModal() { document.getElementById('addModalOverlay').classList.add('open'); }
    function closeAddModal() { document.getElementById('addModalOverlay').classList.remove('open'); document.getElementById('addPersonForm').reset(); }

    document.getElementById('addPersonForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const newUser = {
        id: Date.now().toString(),
        displayName: `${document.getElementById('f_nom').value.toUpperCase()} ${document.getElementById('f_prenom').value}`,
        type: document.getElementById('f_type').value,
        oldClass: document.getElementById('f_oldclass').value.toUpperCase(),
        newClass: document.getElementById('f_newclass').value.toUpperCase()
      };
      USERS.push(newUser);
      renderClassOptions();
      applyFilters();
      closeAddModal();
    });

    // 2. Import de nouvelle base de données
    document.getElementById('importDbInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const importedData = JSON.parse(evt.target.result);
          // On s'attend à un tableau d'utilisateurs ou un objet { users: [...] }
          USERS = Array.isArray(importedData) ? importedData : (importedData.users || []);
          renderClassOptions();
          applyFilters();
          alert(`${USERS.length} profils importés avec succès !`);
        } catch (err) {
          alert("Erreur lors de la lecture du fichier JSON. Vérifiez le format.");
        }
      };
      reader.readAsText(file);
      e.target.value = ''; // Reset input
    });

    // Initialisation
    renderClassOptions();
    applyFilters();
  </script>
</body>
</html>
