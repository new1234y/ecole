<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lycée CRM & Social Graph</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-main: #F3F4F6;
            --bg-card: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar - Liste et Filtres */
        .sidebar {
            width: 350px; background: var(--bg-card); border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
        }
        
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { margin: 0 0 15px 0; font-size: 1.2rem; color: var(--primary); }
        
        .filters input, .filters select {
            width: 100%; padding: 8px; margin-bottom: 10px;
            border: 1px solid var(--border); border-radius: 6px;
        }

        .btn {
            background: var(--primary); color: white; border: none;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 5px;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--text-muted); }

        .person-list { flex: 1; overflow-y: auto; padding: 10px; }
        .person-card {
            padding: 10px; border: 1px solid var(--border); border-radius: 6px;
            margin-bottom: 10px; cursor: pointer; transition: 0.2s;
        }
        .person-card:hover { border-color: var(--primary); background: #EEF2FF; }
        .person-name { font-weight: bold; }
        .person-meta { font-size: 0.85rem; color: var(--text-muted); }
        .badge {
            background: #E0E7FF; color: var(--primary); padding: 2px 6px;
            border-radius: 12px; font-size: 0.75rem; margin-right: 5px;
        }

        /* Main Content - Profil */
        .main-content {
            flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column;
        }
        
        .profile-container {
            background: var(--bg-card); border-radius: 8px; padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; width: 100%;
            display: none;
        }

        .profile-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px;}
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group textarea, .form-group select {
            padding: 8px; border: 1px solid var(--border); border-radius: 6px;
        }
        .form-group.full-width { grid-column: span 2; }

        .relations-box, .image-box {
            background: #F9FAFB; padding: 15px; border-radius: 6px; margin-top: 15px; border: 1px solid var(--border);
        }
        
        .img-preview { max-width: 100%; max-height: 300px; margin-top: 10px; border-radius: 6px; display: none; }

        .setup-screen { text-align: center; margin: auto; padding: 40px; background: white; border-radius: 8px; shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Lycée CRM</h1>
            <div class="filters">
                <input type="text" id="searchInput" placeholder="Rechercher un nom, prénom..." onkeyup="renderList()">
                <select id="classFilter" onchange="renderList()">
                    <option value="">Toutes les classes actuelles</option>
                </select>
                <select id="labelFilter" onchange="renderList()">
                    <option value="">Tous les labels</option>
                </select>
            </div>
            <button class="btn" onclick="createNewProfile()">+ Nouveau Profil</button>
            <button class="btn btn-secondary" onclick="document.getElementById('jsonUpload').click()" style="margin-top:5px; font-size: 0.8rem;">🔄 Importer annuaire_data.json</button>
            <input type="file" id="jsonUpload" accept=".json" style="display: none;" onchange="importJSON(event)">
        </div>
        <div class="person-list" id="personList">
            <!-- La liste s'affichera ici -->
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- Message de bienvenue -->
        <div id="welcomeScreen" class="setup-screen">
            <h2>Bienvenue dans votre CRM Personnel</h2>
            <p>Sélectionnez un profil à gauche, créez-en un nouveau, ou importez votre fichier de l'année dernière.</p>
        </div>

        <!-- Editeur de profil -->
        <div id="profileView" class="profile-container">
            <div class="profile-header">
                <h2 id="profileTitle">Édition du Profil</h2>
                <button class="btn" style="width: auto;" onclick="saveProfile()">💾 Sauvegarder</button>
            </div>
            
            <input type="hidden" id="editId">
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Nom Complet (ou Prénom Nom)</label>
                    <input type="text" id="editName" placeholder="Ex: BUGRA Matheo">
                </div>
                <div class="form-group">
                    <label>Origine (Collège/Ancien Lycée)</label>
                    <input type="text" id="editOrigin" placeholder="Ex: Collège Jean Moulin">
                </div>
                <div class="form-group">
                    <label>Ancienne Classe (Année dernière)</label>
                    <input type="text" id="editOldClass" placeholder="Ex: 2GT6">
                </div>
                <div class="form-group">
                    <label>Classe Actuelle</label>
                    <input type="text" id="editCurrentClass" placeholder="Ex: 1G2, 1PRO MS..." onchange="updateFilters()">
                </div>
                <div class="form-group">
                    <label>Groupes / Spécialités (séparés par des virgules)</label>
                    <input type="text" id="editGroups" placeholder="Spé Maths, Spé Physique, Club Échecs">
                </div>
                <div class="form-group">
                    <label>Labels / Catégories (séparés par des virgules)</label>
                    <input type="text" id="editLabels" placeholder="Ami, Connaissance, BDE...">
                </div>
                <div class="form-group full-width">
                    <label>Notes & Informations libres</label>
                    <textarea id="editNotes" rows="3" placeholder="Informations diverses, passions..."></textarea>
                </div>
            </div>

            <div class="relations-box">
                <div class="form-group full-width">
                    <label>Relations (Parents, Frères/Soeurs, Amis) - Séparés par des virgules</label>
                    <textarea id="editRelations" rows="2" placeholder="PEREIRA Mélanie (Mère), BUGRA Teddy (Père)"></textarea>
                </div>
            </div>

            <div class="image-box">
                <label style="font-weight: bold; font-size: 0.85rem; color: var(--text-muted);">Emploi du temps (ou photo)</label>
                <input type="file" id="editTimetable" accept="image/*" style="margin-top: 5px; width: 100%;" onchange="handleImageUpload(event)">
                <img id="timetablePreview" class="img-preview" src="" alt="Aperçu">
                <input type="hidden" id="editTimetableBase64">
                <button id="removeImgBtn" style="display:none; margin-top:10px;" onclick="removeImage()">❌ Supprimer l'image</button>
            </div>
        </div>
    </div>

    <script>
        // 1. GESTION DES DONNÉES (LocalStorage)
        let db = {
            persons: [],
            classes: new Set(),
            labels: new Set()
        };

        function loadData() {
            const saved = localStorage.getItem('lyceeCRM_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                db.persons = parsed.persons || [];
                extractFilters();
                renderList();
            }
        }

        function saveData() {
            localStorage.setItem('lyceeCRM_data', JSON.stringify({ persons: db.persons }));
            extractFilters();
        }

        function extractFilters() {
            db.classes.clear();
            db.labels.clear();
            db.persons.forEach(p => {
                if (p.currentClass) db.classes.add(p.currentClass);
                if (p.labels) {
                    p.labels.split(',').forEach(l => {
                        let cleanLabel = l.trim();
                        if(cleanLabel) db.labels.add(cleanLabel);
                    });
                }
            });
            updateSelectOptions('classFilter', db.classes, 'Toutes les classes actuelles');
            updateSelectOptions('labelFilter', db.labels, 'Tous les labels');
        }

        function updateSelectOptions(elementId, setValues, defaultText) {
            const select = document.getElementById(elementId);
            const currentVal = select.value;
            select.innerHTML = `<option value="">${defaultText}</option>`;
            Array.from(setValues).sort().forEach(val => {
                select.innerHTML += `<option value="${val}">${val}</option>`;
            });
            if (setValues.has(currentVal)) select.value = currentVal;
        }

        // 2. IMPORT ET DÉDUCTION DES CLASSES
        function predictNextClass(oldClass) {
            if (!oldClass) return "";
            oldClass = oldClass.toUpperCase().trim();
            
            // Logique de passage de classe (A adapter selon le lycée)
            if (oldClass.startsWith('2GT')) return "1G (Générale/Techno à préciser)";
            if (oldClass.includes('2PRO') || (oldClass.startsWith('2') && (oldClass.includes('MS') || oldClass.includes('AGORA')))) {
                return oldClass.replace(/2PRO|2/g, '1PRO'); // ex: 2PRO MS -> 1PRO MS
            }
            if (oldClass.startsWith('1PRO')) return oldClass.replace('1PRO', 'TPRO');
            if (oldClass.match(/^1G\d*/)) return oldClass.replace('1G', 'TG');
            if (oldClass.match(/^1T/)) return oldClass.replace('1T', 'TT'); // STMG, STI2D...
            
            return "À définir";
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    let importCount = 0;

                    // Supporte un tableau d'objets ou un objet contenant un tableau
                    const items = Array.isArray(data) ? data : (data.users || data.data || []);

                    items.forEach(item => {
                        // Eviter les doublons par ID ou Nom
                        if (!db.persons.find(p => p.id === item.id || p.name === item.displayName)) {
                            let oldClassStr = (item.classes && item.classes.length > 0) ? item.classes.join(', ') : "";
                            let relationsStr = (item.relations && item.relations.length > 0) 
                                                ? item.relations.map(r => r.name).join(', ') : "";

                            let newPerson = {
                                id: item.id || crypto.randomUUID(),
                                name: item.displayName || item.name || "Inconnu",
                                oldClass: oldClassStr,
                                currentClass: predictNextClass(oldClassStr),
                                origin: "",
                                groups: "",
                                labels: "Annuaire 2025",
                                notes: "",
                                relations: relationsStr,
                                timetableImg: ""
                            };
                            db.persons.push(newPerson);
                            importCount++;
                        }
                    });

                    saveData();
                    renderList();
                    alert(`${importCount} profils importés avec succès !`);
                } catch (error) {
                    alert("Erreur lors de la lecture du fichier JSON : " + error);
                }
            };
            reader.readAsText(file);
            event.target.value = ""; // reset
        }

        // 3. UI: LISTE ET FILTRES
        function renderList() {
            const listDiv = document.getElementById('personList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const classFilter = document.getElementById('classFilter').value;
            const labelFilter = document.getElementById('labelFilter').value;

            listDiv.innerHTML = "";

            let filtered = db.persons.filter(p => {
                let matchSearch = p.name.toLowerCase().includes(search) || 
                                  (p.notes && p.notes.toLowerCase().includes(search));
                let matchClass = classFilter ? p.currentClass === classFilter : true;
                let matchLabel = labelFilter ? (p.labels && p.labels.includes(labelFilter)) : true;
                return matchSearch && matchClass && matchLabel;
            });

            // Tri par nom
            filtered.sort((a, b) => a.name.localeCompare(b.name));

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'person-card';
                card.onclick = () => showProfile(p.id);
                
                let labelsHtml = "";
                if(p.currentClass) labelsHtml += `<span class="badge">${p.currentClass}</span>`;
                if(p.labels) {
                    p.labels.split(',').slice(0,2).forEach(l => {
                        let clean = l.trim();
                        if(clean) labelsHtml += `<span class="badge" style="background:#F3F4F6; color:var(--text-muted);">${clean}</span>`;
                    });
                }

                card.innerHTML = `
                    <div class="person-name">${p.name}</div>
                    <div class="person-meta" style="margin-top:5px;">${labelsHtml}</div>
                `;
                listDiv.appendChild(card);
            });
        }

        // 4. UI: PROFIL (CRUD)
        function createNewProfile() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileTitle').innerText = "Nouveau Profil";
            
            document.getElementById('editId').value = crypto.randomUUID();
            document.getElementById('editName').value = "";
            document.getElementById('editOrigin').value = "";
            document.getElementById('editOldClass').value = "";
            document.getElementById('editCurrentClass').value = "";
            document.getElementById('editGroups').value = "";
            document.getElementById('editLabels').value = "";
            document.getElementById('editNotes').value = "";
            document.getElementById('editRelations').value = "";
            
            removeImage(); // Réinitialise l'image
        }

        function showProfile(id) {
            const person = db.persons.find(p => p.id === id);
            if (!person) return;

            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileTitle').innerText = person.name;

            document.getElementById('editId').value = person.id;
            document.getElementById('editName').value = person.name || "";
            document.getElementById('editOrigin').value = person.origin || "";
            document.getElementById('editOldClass').value = person.oldClass || "";
            document.getElementById('editCurrentClass').value = person.currentClass || "";
            document.getElementById('editGroups').value = person.groups || "";
            document.getElementById('editLabels').value = person.labels || "";
            document.getElementById('editNotes').value = person.notes || "";
            document.getElementById('editRelations').value = person.relations || "";

            if (person.timetableImg) {
                document.getElementById('timetablePreview').src = person.timetableImg;
                document.getElementById('timetablePreview').style.display = 'block';
                document.getElementById('editTimetableBase64').value = person.timetableImg;
                document.getElementById('removeImgBtn').style.display = 'inline-block';
            } else {
                removeImage();
            }
        }

        function saveProfile() {
            const id = document.getElementById('editId').value;
            let person = db.persons.find(p => p.id === id);
            
            const isNew = !person;
            if (isNew) {
                person = { id: id };
                db.persons.push(person);
            }

            person.name = document.getElementById('editName').value;
            person.origin = document.getElementById('editOrigin').value;
            person.oldClass = document.getElementById('editOldClass').value;
            person.currentClass = document.getElementById('editCurrentClass').value;
            person.groups = document.getElementById('editGroups').value;
            person.labels = document.getElementById('editLabels').value;
            person.notes = document.getElementById('editNotes').value;
            person.relations = document.getElementById('editRelations').value;
            person.timetableImg = document.getElementById('editTimetableBase64').value;

            document.getElementById('profileTitle').innerText = person.name;
            
            saveData();
            renderList();
            
            // Indication visuelle de sauvegarde
            const btn = document.querySelector('.profile-header .btn');
            const oldText = btn.innerText;
            btn.innerText = "✅ Sauvegardé !";
            btn.style.background = "#10B981";
            setTimeout(() => {
                btn.innerText = oldText;
                btn.style.background = "var(--primary)";
            }, 2000);
        }

        function updateFilters() {
            // Optionnel : mettre à jour la liste des filtres quand on tape une nouvelle classe
        }

        // 5. GESTION DES IMAGES (Redimensionnement pour éviter de remplir le localstorage)
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Redimensionner via un Canvas pour limiter le poids
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7); // compression JPEG 70%
                    
                    document.getElementById('timetablePreview').src = dataUrl;
                    document.getElementById('timetablePreview').style.display = 'block';
                    document.getElementById('editTimetableBase64').value = dataUrl;
                    document.getElementById('removeImgBtn').style.display = 'inline-block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function removeImage() {
            document.getElementById('timetablePreview').src = "";
            document.getElementById('timetablePreview').style.display = 'none';
            document.getElementById('editTimetableBase64').value = "";
            document.getElementById('editTimetable').value = "";
            document.getElementById('removeImgBtn').style.display = 'none';
        }

        // Initialisation
        window.onload = loadData;

    </script>
</body>
</html>
