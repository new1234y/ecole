<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Groupes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- En-tête -->
  <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">Gestionnaire de Groupes</h1>
    <div class="flex items-center gap-4">
      <label class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg cursor-pointer text-sm font-medium transition">
        Importer JSON
        <input type="file" id="jsonInput" accept=".json" class="hidden">
      </label>
      <button id="exportBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition disabled:opacity-50" disabled>
        Exporter JSON
      </button>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 max-w-7xl mx-auto w-full">
    
    <!-- Colonne de gauche : Annuaire des personnes -->
    <section class="lg:col-span-5 bg-white p-5 rounded-xl shadow flex flex-col h-[780px]">
      <h2 class="text-lg font-semibold border-b pb-3 mb-4">Annuaire des membres</h2>
      
      <!-- Filtres et recherche -->
      <div class="space-y-3 mb-4">
        <input type="text" id="searchInput" placeholder="Rechercher un nom..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        <div class="flex gap-2">
          <select id="classFilter" class="w-1/2 border border-slate-300 rounded-lg p-2 text-sm outline-none">
            <option value="">Toutes les classes</option>
          </select>
          <select id="typeFilter" class="w-1/2 border border-slate-300 rounded-lg p-2 text-sm outline-none">
            <option value="">Tous les rôles</option>
            <option value="Student">Élève</option>
            <option value="Teacher">Enseignant</option>
            <option value="Personnel">Personnel</option>
          </select>
        </div>
      </div>

      <!-- Liste des personnes -->
      <div id="peopleList" class="flex-1 overflow-y-auto space-y-2 pr-1 border-t pt-3">
        <p class="text-slate-400 text-sm text-center mt-10">Veuillez importer un fichier JSON.</p>
      </div>
    </section>

    <!-- Colonne de droite : Gestion des groupes -->
    <section class="lg:col-span-7 bg-white p-5 rounded-xl shadow flex flex-col h-[780px]">
      <h2 class="text-lg font-semibold border-b pb-3 mb-4">Groupes</h2>

      <!-- Création de groupe -->
      <div class="flex gap-2 mb-6">
        <input type="text" id="newGroupName" placeholder="Nom du nouveau groupe (ex: Groupe Projets)..." class="flex-1 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        <button id="createGroupBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          Créer Groupe
        </button>
      </div>

      <!-- Sélecteur de groupe actif -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Groupe sélectionné</label>
        <select id="groupSelect" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none font-medium">
          <option value="">-- Aucun groupe --</option>
        </select>
      </div>

      <!-- Zone du groupe sélectionné -->
      <div id="activeGroupContainer" class="flex-1 border rounded-xl p-4 flex flex-col bg-slate-50">
        <div class="flex justify-between items-center mb-4">
          <h3 id="activeGroupName" class="font-bold text-slate-700">Aucun groupe sélectionné</h3>
          <button id="deleteGroupBtn" class="text-red-500 hover:text-red-700 text-xs font-semibold hidden">Supprimer ce groupe</button>
        </div>

        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Membres affectés (<span id="memberCount">0</span>)</p>
        
        <div id="groupMembersList" class="flex-1 overflow-y-auto space-y-2 pr-1 bg-white border rounded-lg p-3">
          <p class="text-slate-400 text-sm text-center mt-10">Sélectionnez un groupe pour voir ses membres.</p>
        </div>
      </div>
    </section>

  </main>

  <script>
    let dbRawData = null;
    let users = [];
    let groups = {}; // Format : { "NomGroupe": ["id_user1", "id_user2"] }
    let activeGroupName = null;

    // Dom Elements
    const jsonInput = document.getElementById('jsonInput');
    const exportBtn = document.getElementById('exportBtn');
    const peopleList = document.getElementById('peopleList');
    const classFilter = document.getElementById('classFilter');
    const typeFilter = document.getElementById('typeFilter');
    const searchInput = document.getElementById('searchInput');
    const newGroupName = document.getElementById('newGroupName');
    const createGroupBtn = document.getElementById('createGroupBtn');
    const groupSelect = document.getElementById('groupSelect');
    const activeGroupNameEl = document.getElementById('activeGroupName');
    const groupMembersList = document.getElementById('groupMembersList');
    const memberCount = document.getElementById('memberCount');
    const deleteGroupBtn = document.getElementById('deleteGroupBtn');

    // Importation JSON
    jsonInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          dbRawData = JSON.parse(event.target.result);
          // Extraction du tableau users qu'il soit à la racine ou dans l'objet principal
          users = Array.isArray(dbRawData) ? dbRawData : (dbRawData.users || []);
          
          if (!users.length) {
            alert("Aucun utilisateur n'a été trouvé dans le fichier.");
            return;
          }

          initGroupsFromUsers();
          populateClassFilter();
          renderPeopleList();
          renderGroupSelect();
          exportBtn.disabled = false;
        } catch (err) {
          alert("Erreur lors de la lecture du fichier JSON. Vérifiez la syntaxe.");
        }
      };
      reader.readAsText(file);
    });

    // Remplit la structure des groupes à partir des attributs 'groups' existants
    function initGroupsFromUsers() {
      groups = {};
      users.forEach(u => {
        if (!u.groups) u.groups = [];
        u.groups.forEach(gName => {
          if (!groups[gName]) groups[gName] = [];
          if (!groups[gName].includes(u.id)) groups[gName].push(u.id);
        });
      });
    }

    // Filtres
    function populateClassFilter() {
      const classes = new Set();
      users.forEach(u => (u.classes || []).forEach(c => classes.add(c)));
      classFilter.innerHTML = '<option value="">Toutes les classes</option>';
      Array.from(classes).sort().forEach(c => {
        classFilter.innerHTML += `<option value="${c}">${c}</option>`;
      });
    }

    searchInput.addEventListener('input', renderPeopleList);
    classFilter.addEventListener('change', renderPeopleList);
    typeFilter.addEventListener('change', renderPeopleList);

    function renderPeopleList() {
      const query = searchInput.value.toLowerCase();
      const selectedClass = classFilter.value;
      const selectedType = typeFilter.value;

      const filtered = users.filter(u => {
        const matchName = u.displayName.toLowerCase().includes(query) || u.login.toLowerCase().includes(query);
        const matchClass = !selectedClass || (u.classes && u.classes.includes(selectedClass));
        const matchType = !selectedType || u.type === selectedType;
        return matchName && matchClass && matchType;
      });

      if (!filtered.length) {
        peopleList.innerHTML = '<p class="text-slate-400 text-sm text-center mt-5">Aucun résultat.</p>';
        return;
      }

      peopleList.innerHTML = filtered.map(u => {
        const isAssignedToActive = activeGroupName && groups[activeGroupName] && groups[activeGroupName].includes(u.id);
        const userClasses = (u.classes || []).join(', ') || 'N/A';
        
        return `
          <div class="flex items-center justify-between p-2 border rounded-lg hover:bg-slate-50 text-sm">
            <div>
              <p class="font-medium text-slate-800">${u.displayName}</p>
              <p class="text-xs text-slate-500">${u.type} — Classe : ${userClasses}</p>
            </div>
            ${activeGroupName ? `
              <button onclick="toggleAssign('${u.id}')" class="px-3 py-1 rounded text-xs font-semibold transition ${isAssignedToActive ? 'bg-red-100 text-red-700 hover:bg-red-200' : 'bg-indigo-100 text-indigo-700 hover:bg-indigo-200'}">
                ${isAssignedToActive ? 'Retirer' : 'Ajouter'}
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // Gestion des Groupes
    createGroupBtn.addEventListener('click', () => {
      const name = newGroupName.value.trim();
      if (!name) return;
      if (groups[name]) {
        alert("Ce groupe existe déjà.");
        return;
      }
      groups[name] = [];
      newGroupName.value = '';
      renderGroupSelect(name);
    });

    function renderGroupSelect(selectGroup = activeGroupName) {
      groupSelect.innerHTML = '<option value="">-- Aucun groupe --</option>';
      Object.keys(groups).sort().forEach(g => {
        groupSelect.innerHTML += `<option value="${g}" ${g === selectGroup ? 'selected' : ''}>${g} (${groups[g].length})</option>`;
      });
      selectGroupHandler(selectGroup);
    }

    groupSelect.addEventListener('change', (e) => selectGroupHandler(e.target.value));

    function selectGroupHandler(gName) {
      activeGroupName = gName || null;
      if (!activeGroupName) {
        activeGroupNameEl.textContent = "Aucun groupe sélectionné";
        groupMembersList.innerHTML = '<p class="text-slate-400 text-sm text-center mt-10">Sélectionnez un groupe pour voir ses membres.</p>';
        memberCount.textContent = '0';
        deleteGroupBtn.classList.add('hidden');
      } else {
        activeGroupNameEl.textContent = activeGroupName;
        deleteGroupBtn.classList.remove('hidden');
        renderActiveGroupMembers();
      }
      renderPeopleList();
    }

    function renderActiveGroupMembers() {
      const memberIds = groups[activeGroupName] || [];
      memberCount.textContent = memberIds.length;

      if (!memberIds.length) {
        groupMembersList.innerHTML = '<p class="text-slate-400 text-sm text-center mt-10">Aucun membre dans ce groupe.</p>';
        return;
      }

      const assignedUsers = users.filter(u => memberIds.includes(u.id));
      groupMembersList.innerHTML = assignedUsers.map(u => `
        <div class="flex items-center justify-between p-2 border-b last:border-b-0 text-sm">
          <div>
            <span class="font-medium text-slate-800">${u.displayName}</span>
            <span class="text-xs text-slate-400 ml-2">(${u.type})</span>
          </div>
          <button onclick="toggleAssign('${u.id}')" class="text-red-500 hover:text-red-700 text-xs font-semibold">
            Retirer
          </button>
        </div>
      `).join('');
    }

    // Ajout/Suppression d'un utilisateur au groupe actif
    window.toggleAssign = function(userId) {
      if (!activeGroupName) return;

      const groupMembers = groups[activeGroupName];
      const index = groupMembers.indexOf(userId);

      const user = users.find(u => u.id === userId);
      if (index === -1) {
        groupMembers.push(userId);
        if (!user.groups.includes(activeGroupName)) user.groups.push(activeGroupName);
      } else {
        groupMembers.splice(index, 1);
        user.groups = user.groups.filter(g => g !== activeGroupName);
      }

      user.groupsCount = user.groups.length;
      renderGroupSelect(activeGroupName);
    };

    deleteGroupBtn.addEventListener('click', () => {
      if (!activeGroupName) return;
      if (confirm(`Voulez-vous supprimer le groupe "${activeGroupName}" ?`)) {
        users.forEach(u => {
          u.groups = (u.groups || []).filter(g => g !== activeGroupName);
          u.groupsCount = u.groups.length;
        });
        delete groups[activeGroupName];
        renderGroupSelect(null);
      }
    });

    // Exporter le fichier JSON
    exportBtn.addEventListener('click', () => {
      let exportData;
      if (Array.isArray(dbRawData)) {
        exportData = users;
      } else {
        exportData = { ...dbRawData, users };
      }

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'annuaire_groupes_maj.json';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
