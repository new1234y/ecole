<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lycée CRM - Smart Edition</title>
    <style>
        :root {
            --primary: #3b82f6; --primary-hover: #2563eb;
            --bg-main: #f8fafc; --bg-card: #ffffff;
            --text-main: #0f172a; --text-muted: #64748b;
            --border: #e2e8f0; --danger: #ef4444;
            --label-bg: #e0f2fe; --label-text: #0369a1;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* UTILITAIRES */
        .btn { background: var(--primary); color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--bg-main); }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: var(--bg-main); outline: none; transition: 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; }

        /* LAYOUT PRINCIPAL */
        .sidebar { width: 380px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px; position: relative; }
        
        /* SIDEBAR (Recherche) */
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: var(--bg-card); z-index: 10;}
        .sidebar-header h1 { font-size: 1.4rem; color: var(--primary); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .search-box { position: relative; margin-bottom: 10px; }
        .search-box input { padding-left: 35px; background: white; }
        .search-icon { position: absolute; left: 10px; top: 10px; opacity: 0.5; }
        .filters-row { display: flex; gap: 10px; margin-bottom: 15px; }
        
        .person-list { flex: 1; overflow-y: auto; padding: 15px; }
        .person-card { padding: 12px 15px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; cursor: pointer; background: white; transition: 0.2s; }
        .person-card:hover { border-color: var(--primary); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .person-name { font-weight: 600; font-size: 1.05rem; }
        .person-details { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }
        
        /* TAGS & LABELS */
        .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { background: var(--label-bg); color: var(--label-text); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; user-select: none; }
        .tag.inactive { background: var(--bg-main); color: var(--text-muted); border: 1px solid var(--border); }
        
        /* PROFIL (Main Content) */
        .profile-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; width: 100%; display: none; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        
        /* AUTOCOMPLETE DROPDOWN */
        .autocomplete-results { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 50; max-height: 200px; overflow-y: auto; display: none; }
        .ac-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid var(--bg-main); }
        .ac-item:hover { background: var(--label-bg); }
        .ac-name { font-weight: bold; }
        .ac-meta { font-size: 0.8rem; color: var(--text-muted); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; position: relative; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .full-width { grid-column: span 2; }
        
        .section-title { font-size: 1rem; color: var(--primary); font-weight: bold; margin: 25px 0 10px 0; border-bottom: 2px solid var(--bg-main); padding-bottom: 5px; grid-column: span 2;}

        /* UPLOAD IMAGE */
        .img-preview { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 10px; display: none; object-fit: contain; background: var(--bg-main); }

        /* RESPONSIVE MOBILE */
        .mobile-back { display: none; margin-right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
        
        @media (max-width: 768px) {
            .sidebar { width: 100%; }
            .main-content { padding: 10px; display: none; }
            body.view-profile .sidebar { display: none; }
            body.view-profile .main-content { display: flex; }
            .mobile-back { display: inline-block; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .section-title { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR: LISTE & RECHERCHE -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1><span>👥 Lycée CRM</span> 
                <button class="btn btn-outline" style="padding: 5px 8px; font-size:0.8rem;" onclick="document.getElementById('importJson').click()">📁 Importer</button>
                <input type="file" id="importJson" accept=".json" style="display:none;" onchange="importData(event)">
            </h1>
            
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Rechercher nom, classe (ex: pro), parent..." onkeyup="renderList()">
            </div>
            
            <div class="filters-row">
                <select id="filterClass" onchange="renderList()">
                    <option value="">Toutes les classes</option>
                </select>
                <select id="filterLabel" onchange="renderList()">
                    <option value="">Tous les labels</option>
                </select>
            </div>
            
            <button class="btn" style="width: 100%;" onclick="createNewProfile()">+ Nouvelle Fiche Élève</button>
        </div>
        
        <div class="person-list" id="personList">
            <!-- Rempli par JS -->
        </div>
    </div>

    <!-- MAIN CONTENT: PROFIL -->
    <div class="main-content">
        <div id="welcomeScreen" style="text-align: center; margin: auto; color: var(--text-muted);">
            <h2>Bienvenue dans votre CRM</h2>
            <p>Sélectionnez un profil ou créez-en un nouveau.</p>
        </div>

        <div id="profileView" class="profile-card">
            <div class="profile-header">
                <div style="display: flex; align-items: center;">
                    <button class="mobile-back" onclick="goBack()">🔙</button>
                    <h2 id="profileTitle" style="margin: 0;">Nouveau Profil</h2>
                </div>
                <button class="btn" id="saveBtn" onclick="saveProfile()">💾 Enregistrer</button>
            </div>

            <input type="hidden" id="editId">
            
            <div class="form-grid">
                <!-- INFOS DE BASE -->
                <div class="section-title">Informations de base</div>
                <div class="form-group full-width">
                    <label>Prénom & Nom</label>
                    <input type="text" id="editName" placeholder="Ex: BUGRA Matheo" oninput="handleAutocomplete(event)" autocomplete="off">
                    <div id="autocompleteBox" class="autocomplete-results"></div>
                </div>

                <div class="form-group">
                    <label>Classe Actuelle</label>
                    <!-- Le dataliste suggère les classes existantes sans forcer la saisie -->
                    <input type="text" id="editCurrentClass" list="classSuggestions" placeholder="Ex: 1G2, 1PRO MS">
                    <datalist id="classSuggestions"></datalist>
                </div>
                
                <div class="form-group">
                    <label>Ancienne Classe (Année dernière)</label>
                    <input type="text" id="editOldClass" placeholder="Ex: 2GT6">
                </div>

                <div class="form-group">
                    <label>Origine (Ancien Lycée/Collège)</label>
                    <input type="text" id="editOrigin" placeholder="Où était-il avant ?">
                </div>

                <div class="form-group">
                    <label>Groupes / Spécialités</label>
                    <input type="text" id="editGroups" placeholder="Spé Maths, Club Info...">
                </div>

                <!-- LABELS INTELLIGENTS -->
                <div class="section-title">Labels & Catégories</div>
                <div class="form-group full-width">
                    <label>Vos labels (Cliquez pour ajouter/retirer)</label>
                    <div id="labelsEditor" class="tag-container"></div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <input type="text" id="newLabelInput" placeholder="Créer un nouveau label..." onkeypress="if(event.key === 'Enter') createLabel()">
                        <button class="btn btn-outline" onclick="createLabel()">Ajouter</button>
                    </div>
                </div>

                <!-- RELATIONS & NOTES -->
                <div class="section-title">Relations & Notes</div>
                <div class="form-group full-width">
                    <label>Relations (Parents, Frères, Sœurs...)</label>
                    <textarea id="editRelations" rows="2" placeholder="Ex: PEREIRA Mélanie (Mère)"></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label>Notes (Passions, détails...)</label>
                    <textarea id="editNotes" rows="3" placeholder="Tout ce qu'il faut retenir..."></textarea>
                </div>

                <!-- EMPLOI DU TEMPS -->
                <div class="section-title">Documents / Emploi du temps</div>
                <div class="form-group full-width">
                    <label>Ajouter une photo (Emploi du temps)</label>
                    <input type="file" id="editImg" accept="image/*" onchange="handleImage(event)">
                    <img id="imgPreview" class="img-preview">
                    <input type="hidden" id="editImgBase64">
                    <button id="removeImgBtn" class="btn btn-outline" style="display:none; margin-top:10px; color: var(--danger); border-color: var(--danger);" onclick="removeImage()">🗑 Supprimer l'image</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. BASE DE DONNÉES LOCALE
        let db = {
            persons: [],
            labels: ["Ami", "Connaissance", "Dans ma classe", "BDE", "Sport"], // Labels par défaut
            classes: []
        };
        let currentEditingLabels = new Set(); // Stocke les labels de la personne en cours d'édition

        // 2. INITIALISATION
        window.onload = () => {
            const saved = localStorage.getItem('crm_lycee_v2');
            if(saved) {
                const parsed = JSON.parse(saved);
                db.persons = parsed.persons || [];
                db.labels = parsed.labels || db.labels;
            }
            extractMetadata();
            renderList();
        };

        function saveDB() {
            localStorage.setItem('crm_lycee_v2', JSON.stringify({ persons: db.persons, labels: db.labels }));
            extractMetadata();
            renderList();
        }

        // Extrait les classes uniques pour les filtres et le Datalist
        function extractMetadata() {
            let classesSet = new Set();
            db.persons.forEach(p => {
                if(p.currentClass) classesSet.add(p.currentClass.trim());
                if(p.oldClass) classesSet.add(p.oldClass.trim());
            });
            db.classes = Array.from(classesSet).sort();

            // Remplir les filtres
            fillSelect('filterClass', db.classes, 'Toutes les classes');
            fillSelect('filterLabel', db.labels, 'Tous les labels');

            // Remplir le datalist des suggestions de classes
            const datalist = document.getElementById('classSuggestions');
            datalist.innerHTML = "";
            db.classes.forEach(c => {
                datalist.innerHTML += `<option value="${c}">`;
            });
        }

        function fillSelect(id, array, defaultText) {
            const select = document.getElementById(id);
            const val = select.value;
            select.innerHTML = `<option value="">${defaultText}</option>`;
            array.forEach(item => select.innerHTML += `<option value="${item}">${item}</option>`);
            if(array.includes(val)) select.value = val;
        }

        // 3. IMPORTATION DE L'ANNUAIRE
        function importData(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    const items = Array.isArray(data) ? data : (data.users || data.data || []);
                    let count = 0;

                    items.forEach(item => {
                        // Cherche si la personne existe déjà
                        if(!db.persons.find(p => p.id === item.id || p.name === item.displayName)) {
                            let oldClassStr = (item.classes && item.classes.length) ? item.classes.join(', ') : "";
                            let relationsStr = (item.relations && item.relations.length) ? item.relations.map(r => r.name).join(', ') : "";
                            
                            db.persons.push({
                                id: item.id || crypto.randomUUID(),
                                name: item.displayName || item.name || "Inconnu",
                                oldClass: oldClassStr,
                                currentClass: "", // Vide car ce sont des données de l'an dernier
                                origin: "Annuaire",
                                groups: "",
                                labels: ["Annuaire"],
                                notes: "",
                                relations: relationsStr,
                                image: ""
                            });
                            count++;
                        }
                    });
                    if(!db.labels.includes("Annuaire")) db.labels.push("Annuaire");
                    saveDB();
                    alert(`${count} profils importés avec succès !`);
                } catch (err) {
                    alert("Erreur JSON : " + err);
                }
            };
            reader.readAsText(file);
        }

        // 4. MOTEUR DE RECHERCHE ET LISTE
        function renderList() {
            const list = document.getElementById('personList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const classFilter = document.getElementById('filterClass').value;
            const labelFilter = document.getElementById('filterLabel').value;

            list.innerHTML = "";

            let filtered = db.persons.filter(p => {
                // Recherche Globale Avancée (Nom, Classes, Relations, Notes)
                let matchSearch = search === "" || 
                    (p.name && p.name.toLowerCase().includes(search)) ||
                    (p.oldClass && p.oldClass.toLowerCase().includes(search)) ||
                    (p.currentClass && p.currentClass.toLowerCase().includes(search)) ||
                    (p.relations && p.relations.toLowerCase().includes(search)) ||
                    (p.notes && p.notes.toLowerCase().includes(search));
                
                let matchClass = classFilter === "" || p.currentClass === classFilter || p.oldClass === classFilter;
                let matchLabel = labelFilter === "" || (p.labels && p.labels.includes(labelFilter));

                return matchSearch && matchClass && matchLabel;
            });

            filtered.sort((a,b) => a.name.localeCompare(b.name));

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'person-card';
                card.onclick = () => openProfile(p.id);
                
                let classTag = p.currentClass ? `<span class="tag">${p.currentClass}</span>` : 
                               (p.oldClass ? `<span class="tag inactive">Ex: ${p.oldClass}</span>` : '');
                
                card.innerHTML = `
                    <div class="person-name">${p.name}</div>
                    <div class="tag-container">${classTag}</div>
                `;
                list.appendChild(card);
            });
        }

        // 5. GESTION DU PROFIL ET DE L'AUTO-COMPLÉTION
        function createNewProfile() {
            showProfileScreen();
            document.getElementById('profileTitle').innerText = "Nouvelle Personne";
            document.getElementById('editId').value = crypto.randomUUID();
            clearForm();
        }

        function openProfile(id) {
            const p = db.persons.find(x => x.id === id);
            if(!p) return;
            
            showProfileScreen();
            document.getElementById('profileTitle').innerText = p.name;
            document.getElementById('editId').value = p.id;
            
            document.getElementById('editName').value = p.name || "";
            document.getElementById('editCurrentClass').value = p.currentClass || "";
            document.getElementById('editOldClass').value = p.oldClass || "";
            document.getElementById('editOrigin').value = p.origin || "";
            document.getElementById('editGroups').value = p.groups || "";
            document.getElementById('editRelations').value = p.relations || "";
            document.getElementById('editNotes').value = p.notes || "";
            
            // Labels
            currentEditingLabels = new Set(p.labels || []);
            renderLabelsEditor();

            // Image
            if(p.image) {
                document.getElementById('imgPreview').src = p.image;
                document.getElementById('imgPreview').style.display = 'block';
                document.getElementById('editImgBase64').value = p.image;
                document.getElementById('removeImgBtn').style.display = 'inline-block';
            } else {
                removeImage();
            }
        }

        function clearForm() {
            ['editName', 'editCurrentClass', 'editOldClass', 'editOrigin', 'editGroups', 'editRelations', 'editNotes'].forEach(id => {
                document.getElementById(id).value = "";
            });
            currentEditingLabels = new Set();
            renderLabelsEditor();
            removeImage();
            document.getElementById('autocompleteBox').style.display = 'none';
        }

        // AUTO-COMPLÉTION INTELLIGENTE : Recherche dans les anciennes données
        function handleAutocomplete(e) {
            const query = e.target.value.toLowerCase();
            const box = document.getElementById('autocompleteBox');
            box.innerHTML = "";
            
            if(query.length < 2) {
                box.style.display = 'none';
                return;
            }

            // On cherche des personnes existantes (généralement celles de l'annuaire sans currentClass)
            const matches = db.persons.filter(p => p.name.toLowerCase().includes(query)).slice(0, 5);

            if(matches.length > 0) {
                box.style.display = 'block';
                matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'ac-item';
                    let metaInfo = (m.oldClass ? `Ex: ${m.oldClass}` : '') + (m.relations ? ` | Parents: ${m.relations}` : '');
                    div.innerHTML = `<div class="ac-name">${m.name}</div><div class="ac-meta">${metaInfo}</div>`;
                    
                    // Si on clique sur la suggestion, on fusionne les données !
                    div.onclick = () => {
                        // On garde l'ID de l'ancien profil pour le mettre à jour plutôt que de créer un doublon
                        document.getElementById('editId').value = m.id;
                        document.getElementById('editName').value = m.name;
                        
                        // On propose l'ancienne classe
                        if(!document.getElementById('editOldClass').value) document.getElementById('editOldClass').value = m.oldClass || "";
                        
                        // On ramène les parents !
                        if(!document.getElementById('editRelations').value) document.getElementById('editRelations').value = m.relations || "";
                        
                        // On charge ses labels existants
                        m.labels.forEach(l => currentEditingLabels.add(l));
                        renderLabelsEditor();
                        
                        box.style.display = 'none';
                    };
                    box.appendChild(div);
                });
            } else {
                box.style.display = 'none';
            }
        }

        // Facher la boite de suggestions si on clique ailleurs
        document.addEventListener('click', (e) => {
            if(e.target.id !== 'editName') document.getElementById('autocompleteBox').style.display = 'none';
        });

        // 6. SYSTÈME DE LABELS
        function renderLabelsEditor() {
            const container = document.getElementById('labelsEditor');
            container.innerHTML = "";
            
            db.labels.forEach(label => {
                const span = document.createElement('span');
                const isActive = currentEditingLabels.has(label);
                span.className = `tag ${isActive ? '' : 'inactive'}`;
                span.innerText = label;
                span.onclick = () => {
                    if(isActive) currentEditingLabels.delete(label);
                    else currentEditingLabels.add(label);
                    renderLabelsEditor();
                };
                container.appendChild(span);
            });
        }

        function createLabel() {
            const input = document.getElementById('newLabelInput');
            const val = input.value.trim();
            if(val && !db.labels.includes(val)) {
                db.labels.push(val);
                currentEditingLabels.add(val); // L'ajoute directement à la personne
                input.value = "";
                renderLabelsEditor();
                saveDB(); // Sauvegarde le nouveau label dispo pour tous
            }
        }

        // 7. SAUVEGARDE ET IMAGES
        function saveProfile() {
            const id = document.getElementById('editId').value;
            let pIndex = db.persons.findIndex(x => x.id === id);
            
            let personData = {
                id: id,
                name: document.getElementById('editName').value,
                currentClass: document.getElementById('editCurrentClass').value,
                oldClass: document.getElementById('editOldClass').value,
                origin: document.getElementById('editOrigin').value,
                groups: document.getElementById('editGroups').value,
                relations: document.getElementById('editRelations').value,
                notes: document.getElementById('editNotes').value,
                labels: Array.from(currentEditingLabels),
                image: document.getElementById('editImgBase64').value
            };

            if(pIndex > -1) db.persons[pIndex] = personData;
            else db.persons.push(personData);

            document.getElementById('profileTitle').innerText = personData.name;
            saveDB();

            const btn = document.getElementById('saveBtn');
            btn.innerHTML = "✅ Enregistré";
            btn.style.background = "#10b981";
            setTimeout(() => { btn.innerHTML = "💾 Enregistrer"; btn.style.background = "var(--primary)"; }, 2000);
        }

        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let w = img.width, h = img.height;
                    if (w > MAX_WIDTH) { h *= MAX_WIDTH / w; w = MAX_WIDTH; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6); // Compression forte (60%) pour ne pas saturer le stockage
                    
                    document.getElementById('imgPreview').src = dataUrl;
                    document.getElementById('imgPreview').style.display = 'block';
                    document.getElementById('editImgBase64').value = dataUrl;
                    document.getElementById('removeImgBtn').style.display = 'inline-block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function removeImage() {
            document.getElementById('imgPreview').src = "";
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('editImgBase64').value = "";
            document.getElementById('editImg').value = "";
            document.getElementById('removeImgBtn').style.display = 'none';
        }

        // 8. NAVIGATION MOBILE
        function showProfileScreen() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('profileView').style.display = 'block';
            document.body.classList.add('view-profile'); // Bascule CSS pour mobile
        }
        
        function goBack() {
            document.body.classList.remove('view-profile');
            renderList(); // Rafraichit la liste au cas où
        }
    </script>
</body>
</html>
